name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x86_64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for git describe

      - name: Build (macOS)
        if: startsWith(matrix.target, 'darwin')
        run: make -j4 release

      # musl static: one binary that runs on every distro
      - name: Build (Linux, musl static)
        if: startsWith(matrix.target, 'linux')
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -euc '
            apk add --no-cache build-base cmake curl tar bzip2 git
            git config --global --add safe.directory /src
            make -j4 STATIC=1 release'

      - name: Smoke test
        run: |
          ./bin/orc --version
          ./bin/orc -h

      - name: Package
        run: tar -C bin -czf orc-${{ matrix.target }}.tar.gz orc

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orc-${{ matrix.target }}
          path: orc-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum orc-*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            orc-*.tar.gz
            checksums.txt

  tap:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Update Homebrew tap
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN secret not set; skipping tap update"
            exit 0
          fi
          sha256sum orc-*.tar.gz > checksums.txt
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/make-formula.sh "$VERSION" checksums.txt > orc.rb
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/brijbyte/homebrew-orc" tap
          mkdir -p tap/Formula
          cp orc.rb tap/Formula/orc.rb
          cd tap
          git add Formula/orc.rb
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com \
            commit -m "orc ${VERSION}"
          git push
