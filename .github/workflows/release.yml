name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build web UI
        run: make web

      # Pure Go, CGO off: one runner cross-compiles all four targets.
      - name: Build
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      - name: Smoke test
        run: |
          ./dist/linux-x86_64/orc --version
          ./dist/linux-x86_64/orc -h

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orc-tarballs
          path: dist/orc-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum orc-*.tar.gz > checksums.txt

      # install.sh ships as a release asset so the bootstrap avoids
      # raw.githubusercontent.com (blackholed on some ISPs).
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            orc-*.tar.gz
            checksums.txt
            install.sh

  tap:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Update Homebrew tap
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN secret not set; skipping tap update"
            exit 0
          fi
          sha256sum orc-*.tar.gz > checksums.txt
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/make-formula.sh "$VERSION" checksums.txt > orc.rb
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/brijbyte/homebrew-orc" tap
          mkdir -p tap/Formula
          cp orc.rb tap/Formula/orc.rb
          cd tap
          git add Formula/orc.rb
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com \
            commit -m "orc ${VERSION}"
          git push
