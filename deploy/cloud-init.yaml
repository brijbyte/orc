#cloud-config
# Rendered by deploy/provision.sh: __TS_AUTHKEY__ / __SERVER_NAME__ are
# substituted. First-boot only; the VM is disposable by design.
package_update: true
package_upgrade: true
packages:
  - git
  - curl
  - jq
  - ripgrep
  - ufw

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  # nightly self-update: reinstall the latest release, which also restarts
  # the user service (install.sh runs `orc service install`)
  - path: /etc/systemd/system/orc-update.service
    content: |
      [Unit]
      Description=update orc to the latest release
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      User=orc
      Environment=ORC_SERVICE=1
      ExecStart=/bin/sh -c 'export XDG_RUNTIME_DIR=/run/user/$$(id -u) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$$(id -u)/bus; curl -fsSL --connect-timeout 5 https://github.com/brijbyte/orc/releases/latest/download/install.sh | sh'
  # cert minting retries in the background: after a same-name rebuild the
  # ACME DNS challenge keeps failing until the reclaimed name propagates,
  # which can take tens of minutes
  - path: /usr/local/bin/orc-cert
    permissions: "0755"
    content: |
      #!/bin/sh
      fqdn=$(tailscale status --json | jq -r .Self.DNSName | sed 's/\.$//')
      for i in $(seq 1 30); do
          tailscale cert "$fqdn" && exit 0
          sleep 60
      done
      exit 1
  - path: /etc/systemd/system/orc-cert.service
    content: |
      [Unit]
      Description=mint the tailnet HTTPS certificate
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/orc-cert
  - path: /etc/systemd/system/orc-update.timer
    content: |
      [Unit]
      Description=nightly orc update

      [Timer]
      OnCalendar=*-*-* 22:00:00 UTC
      RandomizedDelaySec=15m
      Persistent=true

      [Install]
      WantedBy=timers.target

runcmd:
  # small VM + agent workloads: swap keeps the OOM killer away from the server
  - fallocate -l 2G /swapfile && chmod 600 /swapfile
  - mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  # Tailscale first, then lock the box down to tailnet-only.
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --authkey=__TS_AUTHKEY__ --hostname=__SERVER_NAME__ --ssh
  - ufw allow in on tailscale0
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw --force enable
  - systemctl restart ssh
  # orc user; lingering so its systemd --user service runs without a login.
  # ~/.config must exist before the install so orc's home is stable there.
  - useradd -m -s /bin/bash orc
  - install -d -o orc -g orc /home/orc/.config
  - echo 'orc ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-orc
  - chmod 440 /etc/sudoers.d/90-orc
  - loginctl enable-linger orc
  - tailscale set --operator=orc
  # install the latest orc release and its service (binds 127.0.0.1:7777)
  - >-
    sudo -iu orc
    env ORC_SERVICE=1
    XDG_RUNTIME_DIR=/run/user/$(id -u orc)
    DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u orc)/bus
    sh -c 'curl -fsSL --connect-timeout 5 https://github.com/brijbyte/orc/releases/latest/download/install.sh | sh'
  - systemctl daemon-reload
  - systemctl enable --now orc-update.timer
  # non-interactive ssh has no ~/.local/bin on PATH; a symlink keeps
  # `ssh orc@<name> orc ...` working (nightly updates replace the target)
  - ln -sf /home/orc/.local/bin/orc /usr/local/bin/orc
  # HTTPS on the tailnet MagicDNS name, proxying to the loopback service;
  # the cert unit retries in the background without blocking cloud-init
  - tailscale serve --bg http://127.0.0.1:7777
  - systemctl start --no-block orc-cert.service
